; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

;[env:bluepill_f103c8]
[env:bluepill_f103c8_128k]
platform = ststm32
;board = bluepill_f103c8
board = bluepill_f103c8_128k
framework = arduino
lib_deps = marcoschwartz/LiquidCrystal_I2C@^1.1.4
build_flags =
    -std=c++17
    -Os
    ;-Wno-c++17-extensions  # Suprime warnings de extensões C++17
    ;-Wno-sign-compare      # Suprime warnings de comparação de sinais


;[env:maple_mini_origin]
;platform = ststm32
;board = maple_mini_origin
;framework = arduino
;upload_protocol = stlink
;debug_tool = stlink
;monitor_speed = 9600
;lib_deps = marcoschwartz/LiquidCrystal_I2C@^1.1.4
;
;[env:bluepill_f103c8_128k]
;platform = ststm32
;board = bluepill_f103c8_128k
;framework = arduino