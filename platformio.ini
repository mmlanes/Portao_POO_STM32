; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[env:bluepill_f103c8]
platform = ststm32@~15.4.0  ; Força GCC 9.x (menor footprint de flash)
;platform = ststm32@~19.3.0  ; 
board = bluepill_f103c8
framework = arduino 
; busca profunda de bibliotecas
lib_ldf_mode = deep+
; (opcional) pode indicar pastas extras de libs
; lib_extra_dirs = /caminho/para/outras/libs
lib_deps = marcoschwartz/LiquidCrystal_I2C@^1.1.4
build_flags =
    -std=c++17
    -Os                    ; Otimização para tamanho
    -ffunction-sections    ; Permite garbage collection de funções  
    -fdata-sections        ; Permite garbage collection de dados
    -Wl,--gc-sections      ; Remove seções não utilizadas
    ;-fno-exceptions        ; Remove suporte a exceções C++
    ;-fno-rtti              ; Remove informações de tipo em runtime
    -fmerge-constants      ; Combina constantes duplicadas
    ;-fno-threadsafe-statics ; Remove código de inicialização thread-safe
    ;-flto                  ; Link Time Optimization - pode economizar 5-10%
    ;-DDISABLE_DEBUG       ; Descomente para remover mensagens de debug e economizar flash
